[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "rust_pii_transformer"
description = "Deterministic Korean PII detection and masking with guaranteed source-offset recovery. Pure Rust, no models. Currently exposes the offset-mapping (span) layer only."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "rust_pii_transformer contributors" }]
keywords = ["pii", "korean", "masking", "privacy", "redaction"]
classifiers = [
    # 탐지·마스킹 층이 아직 없으므로 성숙도를 있는 그대로 적는다.
    "Development Status :: 3 - Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Security",
    "Natural Language :: Korean",
]
# version 은 Cargo.toml 의 package.version 에서 자동으로 가져온다 (dynamic).
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/arabangoo/rust_pii_transformer"

[tool.maturin]
# Rust 의 #[pymodule] 함수명 = cdylib 이름과 일치해야 한다.
module-name = "rust_pii_transformer"
# Python 바인딩(cdylib) 활성 feature. 코어는 default 로 항상 빌드된다.
features = ["python"]
# abi3(stable ABI) 휠 → Python 3.9+ 단일 휠로 호환.
